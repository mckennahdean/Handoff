server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses real URLs like /procedures and /gaps. Those are
    # not real files, so serve index.html and let Vue show the page.
    # Without this, refreshing any page except / returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic browser security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}