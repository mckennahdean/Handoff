name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: .
        env:
          GEMINI_API_KEY: fake-key-for-ci
        run: |
          if [ -f backend/test_main.py ]; then
            python -m pytest backend/test_main.py -v
          else
            echo "No test_main.py yet; skipping pytest"
          fi