name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: handoff_test
          POSTGRES_USER: handoff_user
          POSTGRES_PASSWORD: handoff_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handoff_user -d handoff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          GEMINI_API_KEY: fake-key-for-ci
          TEST_DATABASE_URL: postgresql+psycopg://handoff_user:handoff_password@localhost:5432/handoff_test
        run: >
          python -m pytest backend/ -v --no-header
          --ignore=backend/test.py --ignore=backend/test_embedding.py
          --cov=backend --cov-report=term-missing --cov-report=xml
          --cov-fail-under=70

      - name: Add coverage table to the job summary
        if: always()
        run: |
          echo "## Backend test coverage" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for frontend
        id: check
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
            echo "No frontend directory yet; skipping frontend job"
          fi

      - name: Set up Node
        if: steps.check.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run lint
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Run build
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend and frontend images
        run: docker compose build

      - name: Start the full stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test the running containers
        run: |
          curl --fail --silent --show-error http://localhost:8000/
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/procedures
          echo "Backend and frontend both responded."

      - name: Add image sizes to the job summary
        run: |
          echo "## Docker images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Size}}" | grep -E "REPOSITORY|handoff" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v