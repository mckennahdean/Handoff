name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          GEMINI_API_KEY: fake-key-for-ci
        run: >
          python -m pytest backend/ -v --no-header
          --ignore=backend/test.py --ignore=backend/test_embedding.py
          --cov=backend --cov-report=term-missing --cov-report=xml
          --cov-fail-under=60

      - name: Add coverage table to the job summary
        if: always()
        run: |
          echo "## Backend test coverage" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for frontend
        id: check
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
            echo "No frontend directory yet; skipping frontend job"
          fi

      - name: Set up Node
        if: steps.check.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run lint
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Run build
        if: steps.check.outputs.has_frontend == 'true'
        working-directory: frontend
        run: npm run build